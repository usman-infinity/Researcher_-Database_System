{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="page-header">
    <div>
        <h1 class="h3 mb-1">Create an Account</h1>
        <p class="text-muted mb-0">Register to upload papers, access personalized research tools, and explore the database.</p>
    </div>
</div>
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-shadow">
            <div class="card-body">
                <h2 class="card-title mb-4">Register</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="name" placeholder="Full Name" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" placeholder="Email" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" placeholder="Password" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <select class="form-select" name="department_id" required>
                            {% for dept in departments %}
                            <option value="{{ dept.id }}">{{ dept.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Register</button>
                </form>
                <p class="mt-3">Already registered? <a href="{{ url_for('auth.login') }}">Login here</a>.</p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
