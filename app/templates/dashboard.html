{% extends "base.html" %}
{% block title %}Dashboard{% endblock %}
{% block content %}
<div class="bg-white rounded shadow-sm p-4">
    <h1>Welcome, {{ user.name }}!</h1>
    <p class="lead">Role: <strong>{{ user.role }}</strong></p>
    <div class="list-group">
        <a class="list-group-item list-group-item-action" href="{{ url_for('papers.list_papers') }}">Browse Papers</a>
        <a class="list-group-item list-group-item-action" href="{{ url_for('papers.search_papers') }}">Search Papers</a>
        {% if user.role == 'faculty' %}
        <a class="list-group-item list-group-item-action" href="{{ url_for('papers.upload_paper') }}">Upload New Paper</a>
        {% endif %}
        {% if user.role == 'admin' %}
        <a class="list-group-item list-group-item-action" href="{{ url_for('admin.view_papers') }}">Admin Panel</a>
        {% endif %}
    </div>
</div>
{% endblock %}
